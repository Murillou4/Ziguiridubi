name: CI

on:
  push:
    branches:
      - main
      - chore/complete-modular-migration
      - refactor/gameapp-systems-and-regression-tests
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck, unit tests, browser tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests (desktop and mobile)
        run: npm run test:e2e

      - name: Production build
        run: npm run build

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oficina-do-vale-browser-validation
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7
